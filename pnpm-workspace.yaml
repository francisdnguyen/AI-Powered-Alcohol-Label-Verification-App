# Supply-chain freshness gate (AGENTS.md): refuse dependency versions
# published less than 7 days ago. Value is in MINUTES: 7d * 24h * 60m = 10080.
# pnpm v11 defaults this to 1440 (1 day); we raise it to 7 days.
minimumReleaseAge: 10080

# Fail resolution rather than silently falling back to a too-new version.
minimumReleaseAgeStrict: true

# Native build scripts are blocked by default; allow only what we vet.
# sharp is a well-known, vetted image library we depend on directly.
allowBuilds:
  sharp: true
  unrs-resolver: false
